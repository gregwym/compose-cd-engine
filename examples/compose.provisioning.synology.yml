# Optional provisioning path mounts. These must equal the private policy paths.
# Use after compose.provisioning.yml. No change to app permissions/ACLs is implied.
services:
  runner:
    volumes:
      - type: bind
        source: ${CD_DEPLOYER_WORKSPACE:?Set the root-only private workspace}
        target: ${CD_DEPLOYER_WORKSPACE:?Use the same absolute host path}
        bind: {create_host_path: false}
      - type: bind
        source: ${CD_DEPLOYER_CONFIG_ROOT:?Set the approved dedicated config root}
        target: ${CD_DEPLOYER_CONFIG_ROOT:?Use the same absolute host path}
        bind: {create_host_path: false}
      - type: bind
        source: ${CD_DEPLOYER_DOWNLOAD_ROOT:?Set the approved dedicated download root}
        target: ${CD_DEPLOYER_DOWNLOAD_ROOT:?Use the same absolute host path}
        bind: {create_host_path: false}
