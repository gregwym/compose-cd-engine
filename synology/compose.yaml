# NAS Compose deployer for Synology Container Manager. See docs/synology.zh-CN.md.
# Put a .env next to this file with at least:
#   DEPLOY_ROOT=/volume1/docker/deployer
#   PROJECTS_ROOT=/volume1/docker
name: compose-deployer

x-engine: &engine
  image: ghcr.io/kurisu-agi/compose-cd-engine:edge
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:size=64m,nosuid,nodev']
  logging:
    driver: json-file
    options: {max-size: 2m, max-file: '3'}

services:
  # One-shot: makes the deployer's state and socket directories root-owned with the modes the
  # services expect, so a DEPLOY_ROOT made in File Station works as is. Exits when done.
  prepare:
    <<: *engine
    command: [python3, -m, shared.prepare, /deployer]
    restart: 'no'
    user: '0:0'
    network_mode: none
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT in .env}:/deployer

  tailscale:
    image: tailscale/tailscale:stable
    hostname: deployer
    restart: unless-stopped
    depends_on:
      prepare: {condition: service_completed_successfully}
    environment:
      TS_HOSTNAME: deployer
      TS_USERSPACE: 'true'
      TS_AUTH_ONCE: 'true'
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    # Approved Serve routes reach applications through their published host ports.
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT in .env}/state/tailscale:/var/lib/tailscale
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT in .env}/run/tailscale:/var/run/tailscale
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: '3'}

  gateway:
    <<: *engine
    command: [python3, -m, gateway.server]
    # Root without capabilities: owns only its own state directory and the Tailscale LocalAPI.
    user: '0:0'
    network_mode: service:tailscale
    depends_on:
      prepare: {condition: service_completed_successfully}
      tailscale: {condition: service_started}
      runner: {condition: service_started}
    environment:
      HOME: /tmp
      CD_FUNNEL: ${CD_FUNNEL:-0}
    volumes:
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT in .env}/state/gateway:/var/lib/compose-cd/gateway
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT in .env}/run/tailscale:/var/run/tailscale
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT in .env}/run/runner:/run/compose-cd

  runner:
    <<: *engine
    command: [python3, -m, runner.server]
    user: '0:0'
    network_mode: none
    depends_on:
      prepare: {condition: service_completed_successfully}
    # Writes Container Manager project files in place, keeping their owners.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    environment:
      HOME: /tmp
      DEPLOY_ROOT: ${DEPLOY_ROOT:?set DEPLOY_ROOT in .env}
      PROJECTS_ROOT: ${PROJECTS_ROOT:-/volume1/docker}
      CD_HEALTH_TIMEOUT: ${CD_HEALTH_TIMEOUT:-120}
      # Pulls are refused below this much free space on PROJECTS_ROOT (plus twice the download); 0 disables.
      CD_MIN_FREE_MB: ${CD_MIN_FREE_MB:-1024}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and outside, so Compose labels and relative mounts match Container Manager.
      - ${PROJECTS_ROOT:-/volume1/docker}:${PROJECTS_ROOT:-/volume1/docker}
      # Empty over the deployer's own directory: env_file, include and extends are read here while
      # rendering, and the policy cannot see their sources, so deployer state must not be readable.
      - type: tmpfs
        target: ${DEPLOY_ROOT:?set DEPLOY_ROOT in .env}
        tmpfs: {size: 65536}
      - ${DEPLOY_ROOT:?set DEPLOY_ROOT in .env}/run/runner:/run/compose-cd
