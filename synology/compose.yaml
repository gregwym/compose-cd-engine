name: compose-deployer

x-engine: &engine
  image: ghcr.io/kurisu-agi/compose-cd-engine:edge
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 2m, max-file: '2'}
  depends_on:
    init: {condition: service_completed_successfully}
  tmpfs: ['/tmp:size=32m,noexec,nosuid,nodev']

services:
  init:
    <<: *engine
    restart: 'no'
    depends_on: {}
    command: [python3, -m, installer.initialize]
    user: '0:0'
    network_mode: none
    cap_add: [CHOWN]
    mem_limit: 64m
    pids_limit: 16
    volumes:
      - type: bind
        source: /volume1/docker/compose-deployer
        target: /install
        bind: {create_host_path: false}

  tailscale:
    image: tailscale/tailscale:stable
    hostname: deployer
    restart: unless-stopped
    user: '0:0'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      init: {condition: service_completed_successfully}
    environment:
      TS_HOSTNAME: deployer
      TS_USERSPACE: 'true'
      TS_AUTH_ONCE: 'true'
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - type: bind
        source: ./state/tailscale
        target: /var/lib/tailscale
        bind: {create_host_path: true}
      - type: bind
        source: ./runtime/tailscale
        target: /var/run/tailscale
        bind: {create_host_path: true}
      - type: bind
        source: ./config/tailscale
        target: /config
        read_only: true
        bind: {create_host_path: true}
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: '2'}

  configure:
    <<: *engine
    command: [python3, -m, installer.configure]
    user: '0:0'
    network_mode: none
    mem_limit: 64m
    pids_limit: 16
    volumes:
      - type: bind
        source: ./runtime/tailscale
        target: /tailscale
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./config/approval
        target: /etc/compose-cd/approval
        bind: {create_host_path: true}
    healthcheck:
      test: [CMD, python3, -m, installer.health, configure]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10m

  approval:
    <<: *engine
    command: [python3, -m, authorization.server, --listen, 127.0.0.1, --wait-policy, --first-enrollment-console]
    user: '10004:30004'
    network_mode: service:tailscale
    depends_on:
      init: {condition: service_completed_successfully}
      tailscale: {condition: service_started, restart: true}
    mem_limit: 96m
    pids_limit: 32
    volumes:
      - type: bind
        source: ./config/approval
        target: /etc/compose-cd/approval
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./state/approval
        target: /var/lib/compose-cd-approval
        bind: {create_host_path: true}
      - type: bind
        source: ./runtime/approval
        target: /run/compose-cd-approval
        bind: {create_host_path: true}
      - type: bind
        source: ./config/service-keys/approval-service
        target: /etc/compose-cd/service-keys/approval-service
        read_only: true
        bind: {create_host_path: true}
    healthcheck:
      test: [CMD, python3, -m, installer.health, approval]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m

  management:
    <<: *engine
    command: [python3, -m, management.gateway, --listen, 127.0.0.1]
    user: '10001:10001'
    group_add: ['30002', '30003']
    network_mode: service:tailscale
    depends_on:
      init: {condition: service_completed_successfully}
      tailscale: {condition: service_started, restart: true}
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - type: bind
        source: ./config/management
        target: /etc/compose-cd/management
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./config/service-keys/management
        target: /etc/compose-cd/service-keys/management
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./config/agent-keys
        target: /etc/compose-cd/agent-keys
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./runtime/management
        target: /run/compose-cd-management
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./state/management
        target: /var/lib/compose-cd-management
        bind: {create_host_path: true}
    healthcheck:
      test: [CMD, python3, -m, installer.health, management]
      interval: 30s
      timeout: 5s
      retries: 3

  runner:
    <<: *engine
    command: [python3, /app/runner/runner.py]
    user: '0:0'
    group_add: ['30002', '30004', '30005']
    network_mode: none
    cap_add: [CHOWN]
    mem_limit: 128m
    pids_limit: 64
    environment:
      CD_AUTHORIZATION_REQUIRED: '1'
      CD_DEPLOYER_POLICY: /etc/compose-cd/provisioning/policy.json
      CD_MANAGEMENT_GID: '30003'
      CD_TARGETS_DIR: /etc/compose-cd/targets
      CD_STATE_DIR: /var/lib/compose-cd/state
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ./config/targets
        target: /etc/compose-cd/targets
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./config/provisioning
        target: /etc/compose-cd/provisioning
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./config/agent-keys
        target: /etc/compose-cd/agent-keys
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./config/service-keys/approval-service
        target: /etc/compose-cd/service-keys/approval-service
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./config/service-keys/verification-service
        target: /etc/compose-cd/service-keys/verification-service
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./runtime/approval
        target: /run/compose-cd-approval
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./runtime/verification
        target: /run/compose-cd-verification
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./runtime/management
        target: /run/compose-cd-management
        bind: {create_host_path: true}
      - type: bind
        source: ./state/runner
        target: /var/lib/compose-cd/state
        bind: {create_host_path: true}
      - type: bind
        source: /volume1/docker/compose-deployer/state/workspace
        target: /volume1/docker/compose-deployer/state/workspace
        bind: {create_host_path: true}
      - type: bind
        source: /volume1/docker/compose-deployer/apps/config
        target: /volume1/docker/compose-deployer/apps/config
        bind: {create_host_path: true}
      - type: bind
        source: /volume1/docker/compose-deployer/apps/downloads
        target: /volume1/docker/compose-deployer/apps/downloads
        bind: {create_host_path: true}
    healthcheck:
      test: [CMD, python3, -m, installer.health, runner]
      interval: 30s
      timeout: 5s
      retries: 3

  project-verifier:
    <<: *engine
    command: [python3, -m, verifier.provisioning]
    user: '10005:30005'
    mem_limit: 192m
    pids_limit: 48
    environment:
      CD_PROVISIONER_VERIFY_POLICY: /etc/compose-cd/provisioning/policy.json
      HOME: /tmp
    volumes:
      - type: bind
        source: ./config/provisioning
        target: /etc/compose-cd/provisioning
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./config/service-keys/verification-service
        target: /etc/compose-cd/service-keys/verification-service
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ./runtime/verification
        target: /run/compose-cd-verification
        bind: {create_host_path: true}
      - type: bind
        source: ./state/verification
        target: /var/lib/compose-cd-verification
        bind: {create_host_path: true}
    healthcheck:
      test: [CMD, python3, -m, installer.health, project-verifier]
      interval: 30s
      timeout: 5s
      retries: 3
