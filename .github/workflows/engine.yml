name: Engine CI and image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: 'python3 -m pip install --require-hashes --only-binary=:all: -r requirements.txt'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/generate_workflows.py --check
      - run: python3 scripts/check_public_tree.py
      - run: sh -n install.sh && bash -n scripts/sync-state.sh
      - run: CD_ENGINE_IMAGE=example.invalid/engine@sha256:$(printf 'a%.0s' {1..64}) docker compose config --quiet
      - run: CD_ENGINE_IMAGE=example.invalid/engine@sha256:$(printf 'a%.0s' {1..64}) docker compose -f compose.yml -f compose.management.yml config --quiet
      - name: Validate minimal Synology Compose profile
        env:
          CD_ENGINE_IMAGE: example.invalid/engine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CD_NAS_APP_CONFIG_DIR: /volume1/compose-cd-apps/example-app
          CD_NAS_CONTROL_SUBNET: 172.31.247.0/28
          CD_NAS_MANAGEMENT_IP: 172.31.247.2
        run: |
          docker compose -f compose.yml -f compose.management.yml -f examples/compose.synology.yml config --format json > /tmp/nas-profile.json
          python3 - <<'PY'
          import json
          cfg = json.load(open('/tmp/nas-profile.json'))
          assert not cfg['services']['management'].get('ports')
          assert cfg['services']['management']['networks']['caddy_net']['ipv4_address'] == '172.31.247.2'
          assert not cfg['services']['receiver'].get('ports')
          assert cfg['services']['runner']['network_mode'] == 'none'
          assert not cfg['networks']['caddy_net'].get('external', False)
          mounts = cfg['services']['runner']['volumes']
          app = [v for v in mounts if v['target'] == '/volume1/compose-cd-apps/example-app']
          assert len(app) == 1 and app[0]['read_only']
          assert not any(v['target'].startswith('/volume1/') and v not in app for v in mounts)
          PY
      - name: Validate optional provisioning mounts
        env:
          CD_ENGINE_IMAGE: example.invalid/engine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CD_DEPLOYER_WORKSPACE: /volume1/compose-deployer-private
          CD_DEPLOYER_CONFIG_ROOT: /volume1/compose-app-config
          CD_DEPLOYER_DOWNLOAD_ROOT: /volume1/compose-downloads
        run: |
          docker compose -f compose.yml -f compose.management.yml -f compose.provisioning.yml -f examples/compose.provisioning.synology.yml config --format json > /tmp/provisioning.json
          python3 - <<'PY'
          import json, os
          cfg = json.load(open('/tmp/provisioning.json'))
          assert cfg['services']['runner']['network_mode'] == 'none'
          roots = {os.environ[k] for k in ('CD_DEPLOYER_WORKSPACE', 'CD_DEPLOYER_CONFIG_ROOT', 'CD_DEPLOYER_DOWNLOAD_ROOT')}
          for name, service in cfg['services'].items():
              for mount in service.get('volumes', []):
                  if mount.get('target') in roots:
                      assert name == 'runner' and mount['source'] == mount['target']
                      assert not mount.get('read_only', False)
          assert not cfg['services']['management'].get('ports')
          PY
      - name: Validate approval and verification isolation
        env:
          CD_ENGINE_IMAGE: example.invalid/engine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          docker compose -f compose.yml -f compose.management.yml -f compose.provisioning.yml -f compose.authorization.yml config --format json > /tmp/authorization.json
          python3 - <<'PY'
          import json
          cfg = json.load(open('/tmp/authorization.json'))
          assert cfg['services']['runner']['network_mode'] == 'none'
          for name in ('approval', 'project-verifier', 'management'):
              service = cfg['services'][name]
              assert not service.get('ports')
              assert not any(v.get('source') == '/var/run/docker.sock' for v in service.get('volumes', []))
          mounts = {name: {v['target'] for v in service.get('volumes', [])} for name, service in cfg['services'].items()}
          assert '/var/lib/compose-cd-approval' not in mounts['runner']
          assert '/run/compose-cd-approval' not in mounts['management']
          assert '/etc/compose-cd/agent-keys' not in mounts['approval']
          assert '/var/lib/compose-cd/state' not in mounts['approval']
          PY
  image:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build native image for smoke tests
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          tags: compose-cd-engine:test
          cache-from: type=gha
      - name: Smoke test packaged engine and tools
        run: |
          docker run --rm --network none --read-only --cap-drop ALL compose-cd-engine:test python3 receiver/receiver.py --help
          docker run --rm --network none --read-only --cap-drop ALL compose-cd-engine:test python3 -c 'import verifier.verifier, verifier.provisioning, runner.runner, management.gateway, management.broker, deployer.service, authorization.server'
          docker run --rm --network none --read-only --cap-drop ALL compose-cd-engine:test docker compose version
          docker run --rm --network none --read-only --cap-drop ALL compose-cd-engine:test cosign version
      - name: Exercise restricted management against disposable Docker services
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --user 0:0 --tmpfs /tmp:size=64m \
            -e CD_DISPOSABLE_CI=1 -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/scripts/smoke_management.py:/integration/smoke.py:ro" \
            compose-cd-engine:test python3 /integration/smoke.py
      - name: Exercise project creation and failed update on disposable Docker
        if: github.event_name == 'pull_request'
        run: |
          sudo install -d -m 700 /run/compose-project-smoke
          docker run --rm --network none --read-only --cap-drop ALL --cap-add CHOWN --user 0:0 --tmpfs /tmp:size=64m \
            -e CD_DISPOSABLE_CI=1 -v /var/run/docker.sock:/var/run/docker.sock \
            -v /run/compose-project-smoke:/run/compose-project-smoke \
            -v "$PWD/scripts/smoke_projects.py:/integration/smoke.py:ro" \
            compose-cd-engine:test python3 /integration/smoke.py
      - name: Exercise full authorization transport with disposable Docker
        if: github.event_name == 'pull_request'
        run: |
          sudo install -d -m 700 /run/compose-project-smoke
          docker run --rm --network none --read-only --cap-drop ALL --cap-add CHOWN --user 0:0 --tmpfs /tmp:size=64m \
            -e CD_DISPOSABLE_CI=1 -e CD_AUTH_SMOKE=1 -v /var/run/docker.sock:/var/run/docker.sock \
            -v /run/compose-project-smoke:/run/compose-project-smoke \
            -v "$PWD/scripts/smoke_projects.py:/integration/smoke.py:ro" \
            -v "$PWD/scripts/auth_smoke_adapter.py:/integration/auth_smoke_adapter.py:ro" \
            -v "$PWD/tests:/integration/tests:ro" \
            compose-cd-engine:test python3 /integration/smoke.py
      - name: Verify public signed provisioning release independently (no Docker socket)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --read-only --cap-drop ALL --user 0:0 --tmpfs /tmp:size=64m --tmpfs /run:size=4m,mode=0755 \
            -e CD_DISPOSABLE_CI=1 -e HOME=/tmp \
            -v "$PWD/scripts/smoke_signed_provisioning.py:/integration/smoke.py:ro" \
            -v "$PWD/examples/agent-deployer-policy.json:/integration/policy.json:ro" \
            compose-cd-engine:test python3 /integration/smoke.py
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
  sign:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the exact image index (separate from build)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
