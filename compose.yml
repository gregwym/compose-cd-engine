name: compose-cd
services:
  receiver:
    image: ${CD_ENGINE_IMAGE:?Set CD_ENGINE_IMAGE to a verified engine image digest}
    restart: unless-stopped
    command: ["python3", "/app/receiver/receiver.py", "--container"]
    user: "10001:10001"
    group_add:
      - "${CD_SIGNAL_GID:-30001}" # only the fixed wake sockets
      - "${CD_SECRET_GID:-30002}" # route-specific webhook secrets
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      CD_SECRET_GID: "${CD_SECRET_GID:-30002}"
    mem_limit: 64m
    pids_limit: 32
    networks:
      caddy_net:
        aliases: [compose-cd-receiver]
    volumes:
      - ./routes:/etc/compose-cd/routes:ro
      - ./secrets:/etc/compose-cd/secrets:ro
      - ./run:/run/compose-cd:ro
    tmpfs:
      - /tmp:size=1m,noexec,nosuid,nodev

  runner:
    image: ${CD_ENGINE_IMAGE:?Set CD_ENGINE_IMAGE to a verified engine image digest}
    restart: unless-stopped
    command: ["python3", "/app/runner/runner.py"]
    network_mode: none
    user: "0:0"
    group_add:
      - "${CD_SIGNAL_GID:-30001}"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    environment:
      CD_TARGETS_DIR: /etc/compose-cd/targets
      CD_STATE_DIR: /var/lib/compose-cd/state
      CD_SIGNAL_GID: "${CD_SIGNAL_GID:-30001}"
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./targets:/etc/compose-cd/targets:ro
      - ./run:/run/compose-cd
      - ./state:/var/lib/compose-cd/state
      - ./inbox:/var/lib/compose-cd/inbox:ro
      - ./secrets/scan-fingerprints.json:/etc/compose-cd/scan-fingerprints.json:ro
      # Add one read-only mount for each managed Compose directory and any
      # bind-mount source directory the Compose CLI needs to resolve.
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev

  verifier:
    image: ${CD_ENGINE_IMAGE:?Set CD_ENGINE_IMAGE to a verified engine image digest}
    restart: unless-stopped
    command: ["python3", "/app/verifier/verifier.py"]
    user: "10001:${CD_SIGNAL_GID:-30001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    pids_limit: 48
    environment:
      HOME: /tmp
      PYTHONPATH: /app
    networks: [caddy_net]
    volumes:
      - ./sources:/etc/compose-cd/sources:ro
      - ./inbox:/var/lib/compose-cd/inbox
      - ./candidates:/var/lib/compose-cd/candidates:ro
      - ./run:/run/compose-cd
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev

networks:
  caddy_net:
    external: true
    name: ${CD_PROXY_NETWORK:-caddy_net}
